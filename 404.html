<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable · Futur Citoyen</title>
    <meta name="description" content="Cette adresse n'existe pas ou n'existe plus sur Futur Citoyen." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#8ed462" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Answer of Netlify, with the code 404, to an address the site does not have (public/_redirects).
         No JavaScript app here: the stylesheet only (src/not-found.ts), with the page background and the
         theme saved by theme-init.js. The service worker never serves this page: a returning visitor's
         browser answers every address with the app, which sends an unknown one back to the home page. -->
    <main class="flex min-h-svh flex-col bg-background text-foreground">
      <div class="mx-auto flex w-full max-w-[62rem] flex-1 flex-col px-[22px] pt-3 pb-10 md:px-8 md:pt-4 lg:px-10">
        <a href="/" class="inline-flex min-h-11 w-fit items-center gap-[0.4em] text-xl font-bold">
          <svg viewBox="0 0 64 64" fill="none" focusable="false" aria-hidden="true" class="size-[1.25em] shrink-0">
            <path d="M32 60 V30" class="stroke-[#2c2e2a] dark:stroke-[#f1eee4]" stroke-width="7" stroke-linecap="round" />
            <path d="M32 35 C 31 21, 20 13, 6 14 C 6 29, 18 37, 32 35 Z" class="fill-[#8ed462] stroke-[#2c2e2a] dark:stroke-[#f1eee4]" stroke-width="4.5" stroke-linejoin="round" />
            <path d="M32 28 C 33 14, 44 6, 58 7 C 58 22, 46 30, 32 28 Z" class="fill-[#f5e211] dark:fill-[#f2de2e] stroke-[#2c2e2a] dark:stroke-[#f1eee4]" stroke-width="4.5" stroke-linejoin="round" />
          </svg>
          <span><span class="text-[#3a7a2c] dark:text-[#8ed462]">Futur</span> <span class="text-[#2c2e2a] dark:text-[#f1eee4]">Citoyen</span></span>
        </a>
        <div class="mt-16 max-w-[34rem]">
          <p class="font-bold text-muted-foreground">Erreur 404</p>
          <h1 class="mt-3 text-[2.125rem] leading-none font-bold tracking-[-0.04em] text-balance md:text-[3rem]">Page introuvable</h1>
          <p class="mt-5 text-lg text-pretty">Cette adresse n'existe pas ou n'existe plus. Vous pouvez revenir à l'accueil pour vous entraîner à l'examen civique.</p>
          <a href="/" class="mt-8 inline-flex min-h-12 items-center rounded-full bg-action px-6 font-bold text-action-foreground">Retour à l'accueil</a>
        </div>
      </div>
    </main>
    <script type="module" src="/src/not-found.ts"></script>
  </body>
</html>
